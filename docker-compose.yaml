version: '2'
services:
  velociraptor:
    container_name: velociraptor
    image: wlambert/velociraptor
    #build:
    #  context: ./
    #  dockerfile: Dockerfile
    volumes:
      - ./velociraptor:/velociraptor/:rw
    environment:
      - VELOX_USER=${VELOX_USER}
      - VELOX_PASSWORD=${VELOX_PASSWORD}
      - VELOX_ROLE=${VELOX_ROLE}
      - VELOX_SERVER_URL=${VELOX_SERVER_URL}
      - VELOX_FRONTEND_HOSTNAME=${VELOX_FRONTEND_HOSTNAME}
    ports:
      # Agent (client) communication - must stay direct, not proxied through nginx
      - "8000:8000"
      - "8001:8001"
    restart: unless-stopped

  nginx:
    container_name: velociraptor-nginx
    image: nginx:stable
    depends_on:
      - velociraptor
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
